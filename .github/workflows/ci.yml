name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Acciones fijadas por commit (repositorio público): actualizar a propósito, con la versión en el comentario.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21, como el de Android Studio con el que se compila en local.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Valida el gradle-wrapper.jar y cachea Gradle (solo escribe la caché desde main).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Sin SENTRY_DSN: el APK de CI no envía nada. La release sale firmada con una clave debug temporal.
      # Los tests instrumentados (androidTest) necesitan emulador y no se pasan aquí.
      - run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lint
